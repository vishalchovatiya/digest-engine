name: Digests

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      digest_id:
        description: 'Optional digest id to run'
        required: false
        type: string
      dry_run:
        description: 'Render only, do not send email'
        required: false
        default: false
        type: boolean

jobs:
  run-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run due digests
        if: ${{ github.event.inputs.digest_id == '' || github.event.inputs.digest_id == null }}
        run: python -m src.main --due ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}

      - name: Run one digest
        if: ${{ github.event.inputs.digest_id != '' && github.event.inputs.digest_id != null }}
        run: python -m src.main --digest "${{ github.event.inputs.digest_id }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
