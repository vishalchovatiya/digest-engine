# This workflow is intentionally disabled.
#
# Automatic scheduling has moved to per-digest workflows.
# Each digest now has its own .github/workflows/digest-<id>.yml file with
# a dedicated cron schedule derived from the digest's YAML configuration.
#
# To regenerate or update all per-digest workflows, run:
#   python scripts/generate_workflows.py
#
# For manual triggering of any digest, use:
#   .github/workflows/manual.yml  (workflow_dispatch from the GitHub Actions UI)
#
# This file is kept as a placeholder so git history is preserved.
# It defines no triggers and no jobs.
name: "Digests (disabled — see digest-<id>.yml files)"

on:
  # No triggers — this workflow does nothing.
  # Uncomment workflow_dispatch below only if you want to re-enable a single
  # catch-all manual trigger (the manual.yml workflow is preferred instead).
  #
  # workflow_dispatch: {}
