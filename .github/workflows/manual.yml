# Manual trigger workflow — run any single digest on demand.
# Automatic scheduled execution is handled by per-digest workflows
# in digest-<id>.yml files (generated by scripts/generate_workflows.py).
#
# Use this workflow to:
#   - Test a specific digest by id without waiting for its cron schedule
#   - Perform a dry-run preview (renders HTML, does not send email)
name: "Manual — Run any digest"

on:
  workflow_dispatch:
    inputs:
      digest_id:
        description: "Digest id to run (e.g. vscode-weekly)"
        required: true
        type: string
      dry_run:
        description: "Render only — do not send email"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        run: >-
          python -m src.main
          --digest "${{ inputs.digest_id }}"
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAILS: ${{ secrets.DIGEST_TO_EMAILS }}
