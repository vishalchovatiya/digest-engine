id: canada-pr-pathways-weekly
enabled: true
schedule:
  type: weekly
  day_of_week: monday
  hour: 5
  minute: 0
  timezone: America/Toronto

email:
  subject: Canada PR Pathways Weekly Digest
  to: []

# Personalized weekly scan for Canadian Permanent Residency pathway updates.
# Tracks BOTH federal Express Entry routes and provincial/PNP routes. The user is
# applying through both federal and province-level schemes, so do not limit
# updates only to OINP, LMIA, closed/sponsored work permit, or employer job-offer
# pathways — federal and provincial PR options are tracked together.
profile_notes:
  current_role: Software/embedded automotive engineer
  employer: General Motors Canada
  location: Ontario, Canada
  education: Master's degree
  job_offer: LMIA-supported
  experience:
    total_years: 12
    canadian_years: 1
    foreign_years: 11
  tracking_strategy:
    - Federal Express Entry
    - Canadian Experience Class (CEC)
    - Federal Skilled Worker (FSW)
    - CRS and category-based draws
    - Provincial Nominee Programs (PNPs)
    - Ontario Immigrant Nominee Program (OINP)
    - LMIA / arranged employment / job-offer changes
    - Software / STEM / engineering / tech occupation changes
  note: >-
    Do not limit updates only to OINP, LMIA, closed work permit, sponsored work
    permit, or employer job-offer pathways. Track both federal and provincial PR
    options because the user is applying through both federal and province-level
    schemes.

sources:
  # Federal / IRCC — change-driven pages only (draw results, rounds table, news feed).
  # Static how-to/instructional pages are intentionally excluded so the digest
  # surfaces draws, rule changes, and announcements rather than evergreen guides.
  - type: webpage
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/rounds-invitations.html
  - type: webpage
    url: https://www.canada.ca/en/immigration-refugees-citizenship/corporate/mandate/policies-operational-instructions-agreements/ministerial-instructions/express-entry-rounds.html
  - type: rss
    url: https://www.canada.ca/en/immigration-refugees-citizenship/news.rss
  # Ontario / OINP — updates feed, invitation rounds, and Express Entry NOIs
  # (the three OINP pages that change with each draw/announcement). The generic
  # OINP landing page and the federal provincial-nominees hub are dropped because
  # they are evergreen overview pages.
  - type: webpage
    url: https://www.ontario.ca/page/2026-ontario-immigrant-nominee-program-updates
  - type: webpage
    url: https://www.ontario.ca/page/ontario-immigrant-nominee-program-oinp-invitations-apply
  - type: webpage
    url: https://www.ontario.ca/page/oinp-express-entry-notifications-interest
  # Reddit — community discussion of draws, NOIs, and rule changes. Weighted on
  # par with official sources per user request.
  - type: rss
    url: https://www.reddit.com/r/ImmigrationCanada/.rss
  - type: rss
    url: https://www.reddit.com/r/OINP/.rss
  - type: rss
    url: https://www.reddit.com/r/canadaexpressentry/.rss
  - type: rss
    url: https://www.reddit.com/r/CanadaImmigrationFAQs/.rss

