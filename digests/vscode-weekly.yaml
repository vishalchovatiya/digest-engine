id: vscode-weekly
enabled: true
schedule:
  type: weekly
  day_of_week: monday
  hour: 5
  minute: 0
  timezone: America/Toronto

email:
  subject: VS Code Weekly Digest
  to: []

sources:
  - type: webpage
    url: https://code.visualstudio.com/updates
  - type: webpage
    url: https://github.blog/changelog/
  - type: webpage
    url: https://github.blog/changelog/label/copilot/
  - type: rss
    url: https://devblogs.microsoft.com/visualstudio/feed/
  - type: rss
    url: https://www.reddit.com/r/vscode/.rss

filters:
  include_keywords:
    - vscode
    - visual studio code
    - extension
    - extensions
    - shortcut
    - shortcuts
    - keybinding
    - keybindings
    - productivity
    - workflow
    - copilot
    - devcontainer
    - codespaces
    - remote development
    - terminal
    - snippets
    - settings
    - profile
    - tips
    - editor
    - debug
  exclude_keywords:
    - pricing
    - legal
    - policy
    - enterprise
    - billing
    - meme
    - memes
    - joke
    - rant
    - drama
    - karma
    - giveaway
    - referral
    - promo
    - discount
    - stock
  freshness_days: 10
  require_any_keywords: true
  max_items: 5

scoring:
  keyword_hit: 3
  title_keyword_hit: 5
  recency_boost_days: 7
  recency_boost_score: 2

render:
  intro: Weekly VS Code features and workflow improvements worth trying.
