# Galaxy Watch 8 — daily price-change watch (DISABLED template)
#
# Status: DISABLED. The trailing `_OFF` suffix in the filename and
# `enabled: false` together ensure that `scripts/generate_workflows.py` does
# NOT emit a scheduled workflow for this digest. To enable later:
#   1. Replace the placeholder product URLs below with the exact product page
#      URLs for the SKU/colour you want to track.
#   2. Rename the file to `digests/galaxy-watch-8-price.yaml` (drop `_OFF`).
#   3. Set `enabled: true`.
#   4. Re-run `python scripts/generate_workflows.py` and commit the new
#      `.github/workflows/digest-galaxy-watch-8-price.yml`.
#
# Limitations: this template uses the existing content-digest pipeline. It
# tracks listing/search/product pages as webpage sources and surfaces items
# whose titles or summaries look like price/deal/drop signals. The pipeline
# does NOT do precise scrape-and-compare price tracking — for that you need
# stable, exact product URLs (and even then large retailers often render
# prices client-side, which the engine cannot read). The intent here is
# "wake me up when something on these pages looks like a price move",
# not "alert on every $1 change".
id: galaxy-watch-8-price
enabled: false
schedule:
  type: daily
  hour: 5
  minute: 0
  timezone: America/Toronto

email:
  subject: Galaxy Watch 8 Price Watch
  to: []

sources:
  # Amazon Canada — search listing (replace with exact product URL when known)
  - type: webpage
    url: https://www.amazon.ca/s?k=Samsung+Galaxy+Watch+8
  # Walmart Canada — search listing
  - type: webpage
    url: https://www.walmart.ca/search?q=samsung+galaxy+watch+8
  # Best Buy Canada — search listing
  - type: webpage
    url: https://www.bestbuy.ca/en-ca/search?search=samsung+galaxy+watch+8
  # Costco Canada — search listing
  - type: webpage
    url: https://www.costco.ca/CatalogSearch?keyword=samsung+galaxy+watch+8
  # Samsung Canada — official store listing
  - type: webpage
    url: https://www.samsung.com/ca/watches/galaxy-watch/
  # RedFlagDeals — Galaxy Watch deal threads (community price signals)
  - type: rss
    url: https://forums.redflagdeals.com/feed/forum/9-hot-deals/?q=galaxy+watch

filters:
  include_keywords:
    - galaxy watch 8
    - galaxy watch8
    - samsung galaxy watch
    - watch 8
    - price drop
    - price cut
    - on sale
    - deal
    - clearance
    - discount
    - rollback
    - save
    - off
    - $
  exclude_keywords:
    - rumor
    - rumour
    - leak
    - leaked
    - concept
    - render
    - renders
    - case
    - band
    - strap
    - screen protector
    - charger only
    - refurbished
    - used
    - knockoff
    - replica
    - review only
    - unboxing
    - hands-on
  freshness_days: 2
  require_any_keywords: true
  max_items: 10

scoring:
  keyword_hit: 2
  title_keyword_hit: 4
  recency_boost_days: 1
  recency_boost_score: 3
  keyword_weights:
    price drop: 6
    price cut: 6
    on sale: 5
    clearance: 5
    deal: 4
    discount: 4
    rollback: 4
    save: 3
    galaxy watch 8: 5
    watch 8: 3

render:
  intro: Daily Galaxy Watch 8 price-movement scan across Amazon, Walmart, Best Buy, Costco, Samsung, and RedFlagDeals. Treat as a heads-up; verify the current price on the retailer page before buying.
