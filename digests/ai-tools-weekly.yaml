id: ai-tools-weekly
enabled: true
schedule:
  type: weekly
  day_of_week: monday
  hour: 5
  minute: 0
  timezone: America/Toronto

email:
  subject: Perplexity, Claude & GitHub Copilot Weekly Digest
  to: []

sources:
  - type: webpage
    url: https://www.perplexity.ai/hub/blog
  - type: webpage
    url: https://www.anthropic.com/news
  - type: webpage
    url: https://github.blog/changelog/label/copilot/
  - type: rss
    url: https://openai.com/news/rss.xml
  - type: rss
    url: https://huggingface.co/blog/feed.xml
  - type: rss
    url: https://blog.google/technology/ai/rss/
  - type: rss
    url: https://www.reddit.com/r/ProductivityApps/.rss
  - type: rss
    url: https://www.reddit.com/r/ChatGPTPro/.rss
  - type: rss
    url: https://www.reddit.com/r/perplexity_ai/.rss

filters:
  include_keywords:
    - perplexity
    - claude
    - copilot
    - chatgpt
    - gemini
    - notebooklm
    - ai
    - agent
    - assistant
    - workflow
    - productivity
    - automation
    - daily
    - tool
    - tools
    - summarization
    - research
    - writing
    - meeting notes
    - email
    - shortcuts
    - code
  exclude_keywords:
    - pricing
    - legal
    - policy
    - billing
    - meme
    - memes
    - joke
    - rant
    - drama
    - karma
    - giveaway
    - referral
    - promo
    - discount
    - stock
    - hiring
    - layoff
    - lawsuit
    - sponsored
    - advertisement
    - crypto
    - nft
    - investor
    - earnings
    - fundraising round
    - series a
    - series b
  freshness_days: 10
  require_any_keywords: true
  max_items: 5

scoring:
  keyword_hit: 2
  title_keyword_hit: 4
  recency_boost_days: 7
  recency_boost_score: 2
  keyword_weights:
    claude: 5
    perplexity: 5
    copilot: 5
    chatgpt: 4
    gemini: 3
    notebooklm: 3
    workflow: 3
    productivity: 3
    agent: 3
    automation: 3
    research: 2
    writing: 2

render:
  intro: Weekly AI tooling changes that are most relevant to practical daily use.
